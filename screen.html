<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛车小游戏 - 大屏 · 5人组队 IWPB赛道</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0e1a;color:#fff;overflow:hidden}
#app{display:flex;height:100vh}#left{flex:1;display:flex;flex-direction:column;padding:18px 22px}
#right{width:360px;background:rgba(255,255,255,.05);padding:18px;display:flex;flex-direction:column}
h1{margin:0 0 4px;font-size:30px}.meta{opacity:.7;font-size:14px;margin-bottom:8px}
#main{flex:1;display:flex;gap:14px;min-height:0}
#qrPanel{width:280px;background:#141b36;border-radius:16px;padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
#qrBox{background:#fff;padding:10px;border-radius:12px;margin:10px 0}#qrBox canvas{display:block}
#joinUrl{font-size:12px;color:#7bed9f;word-break:break-all}
#trackWrap{flex:1;background:#141b36;border-radius:16px;position:relative;overflow:hidden;padding:14px}
canvas{width:100%;height:100%;display:block}
#board{flex:1;overflow-y:auto;margin-top:8px}
.row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,.06);font-size:14px}
.row.top1{background:linear-gradient(90deg,#f9ca24,#f0932b);color:#222;font-weight:800}
.row.top2{background:linear-gradient(90deg,#c7ecee,#95afc0);color:#222;font-weight:700}
.row.top3{background:linear-gradient(90deg,#f8c291,#e58e26);color:#222;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%}
#controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#controls button{flex:1;min-width:100px;padding:12px 0;font-size:15px;font-weight:800;border:none;border-radius:10px;cursor:pointer}
#serverBar{display:flex;gap:8px;margin-bottom:8px}#serverBar input{flex:1;padding:10px 12px;font-size:14px;border-radius:8px;border:none;outline:none}
#serverBar button{padding:10px 16px;font-size:14px;font-weight:800;border:none;border-radius:8px;background:#2ed573;cursor:pointer}
.mates{display:flex;gap:4px}.mates span{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;overflow:hidden}.mates img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="app">
<div id="left">
<h1>🏎️ 5人组队赛 <span style="font-size:14px;opacity:.6">一车5人 · IWPB赛道 · 随机组队</span></h1>
<div class="meta" id="metaLine">扫码 → 选头像加入 → 凑齐5人 → 全队一起点击加速</div>
<div id="serverBar"><input id="serverInput" placeholder="后端地址，例如 https://xxx.onrender.com（本地留空）"><button id="serverBtn">连接</button></div>
<div id="main">
<div id="qrPanel"><h2 style="margin:0">微信扫码参加</h2><div>已加入 <b id="waitCount">0</b> 人 · <span id="teamCount">0</span> 队</div><div id="qrBox"><canvas id="qr"></canvas></div><div id="joinUrl"></div></div>
<div id="trackWrap"><canvas id="cv"></canvas></div>
</div>
</div>
<div id="right">
<h3 style="margin:0">🏆 车队榜（用时最短优先）</h3>
<div id="board"></div>
<div id="controls"><button id="btnShuffle" style="background:#70a1ff">🎲 重新组队</button><button id="btnReset" style="background:#ffa502">↺ 重置</button><button id="btnClear" style="background:#ff4757;color:#fff">✕ 清人</button></div>
<div style="font-size:12px;opacity:.7;margin-top:8px;line-height:1.7">每队=一辆车，车上5个头像<br>5人同时点击，全队合力前进</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
let SERVER_URL=(qs.get('server')||'').trim()||(localStorage.getItem('race_server')||'').trim();
if(!SERVER_URL&&!location.hostname.endsWith('github.io')){SERVER_URL=location.origin;connect();}
else if(SERVER_URL){$('serverInput').value=SERVER_URL;connect();}
$('serverBtn').onclick=()=>{const v=$('serverInput').value.trim().replace(/\/$/,'');if(!v)return alert('请填写后端地址');localStorage.setItem('race_server',v);location.search='?server='+encodeURIComponent(v);};
let socket=null,teams=[],TRACK=400;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ms=>ms==null?'—':(ms/1000).toFixed(1)+'s';
function pageBase(){const u=new URL('index.html',location.href);if(SERVER_URL&&SERVER_URL!==location.origin)u.searchParams.set('server',SERVER_URL);return u.toString();}
function mateHtml(m){const inner=m.avatar&&m.avatar.startsWith('data:')?`<img src="${m.avatar}">`:esc(m.avatar||'🏎️');return `<span title="${esc(m.nickname)}">${inner}</span>`;}
// ===== IWPB赛道绘制：4段路拼成 I→W→P→B，每队一辆载5头像的车 =====
const cv=$('cv'),ctx=cv.getContext('2d');
function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;}
addEventListener('resize',resize);resize();
function draw(){
const W=cv.width,H=cv.height,dpr=devicePixelRatio;ctx.clearRect(0,0,W,H);
ctx.fillStyle='rgba(255,255,255,.55)';ctx.font=`${13*dpr}px sans-serif`;ctx.textAlign='center';
ctx.fillText('I W P B 赛道示意 · 每队一车 · 进度条即赛道',W/2,18*dpr);
// 每队一行：车+5头像+进度条
const rows=Math.max(teams.length,1),rowH=(H-50*dpr)/Math.max(rows,6);
teams.slice(0,10).forEach((t,i)=>{
const y=40*dpr+rowH*i+rowH/2;
ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(150*dpr,y-3, W-220*dpr,6);
// 小车位置
const x=150*dpr+(W-220*dpr)*Math.min(1,t.distance/TRACK);
ctx.font=`${Math.min(26*dpr,rowH*.5)}px serif`;ctx.textAlign='left';
ctx.fillText('🚗',x-12*dpr,y-6*dpr);
// 车上5头像
ctx.font=`${12*dpr}px serif`;
t.members.slice(0,5).forEach((m,k)=>{const a=(m.avatar&&!m.avatar.startsWith('data:'))?m.avatar:'●';ctx.fillStyle=m.color||'#fff';ctx.fillText(a,x-10*dpr+k*11*dpr,y-20*dpr);});
ctx.fillStyle='#fff';ctx.font=`${12*dpr}px sans-serif`;
ctx.fillText((t.name||'').slice(0,8),8,y);
ctx.fillStyle=t.full?'#7bed9f':'#ffa502';
ctx.fillText(t.count+'/5'+(t.status==='running'?' ·跑':t.status==='finished'?' ·完':' ·等'),8,y+14*dpr);
ctx.fillStyle='#fff';ctx.fillText(Math.round(t.distance)+'m',W-58*dpr,y);
});
requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function connect(){
const ju=pageBase();$('joinUrl').textContent=ju;QRCode.toCanvas($('qr'),ju,{width:190,margin:1},()=>{});
socket=io(SERVER_URL,{transports:['websocket','polling']});
socket.on('board',({teams:ts,track,count})=>{teams=ts;TRACK=track;
$('waitCount').textContent=count;$('teamCount').textContent=ts.length;
$('board').innerHTML=ts.map((t,i)=>`<div class="row ${i===0?'top1':i===1?'top2':i===2?'top3':''}"><b>${i+1}</b><span class="dot" style="background:${t.color}"></span><span style="flex:1">${esc(t.name)} · ${t.count}/5 · ${fmt(t.bestMs)}<br><span class="mates">${t.members.map(mateHtml).join('')}</span></span><span>${Math.round(t.progress)}%</span></div>`).join('')||'<p style="opacity:.5">等待扫码组队…</p>';});
$('btnShuffle').onclick=()=>{if(confirm('打散重随5人一队？'))socket.emit('host_shuffle');};
$('btnReset').onclick=()=>{if(confirm('重置所有车队进度（保留 teams/最快成绩清零？不，保留最快）？'))socket.emit('host_reset');};
$('btnClear').onclick=()=>{if(confirm('清空所有人员？'))socket.emit('host_clear');};
}
</script>
</body>
</html>
