<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>赛车小游戏 - 5人组队赛</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#0f2027,#203a43,#2c5364);color:#fff;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:24px 20px 40px}
h1{text-align:center;font-size:24px;margin:12px 0 4px}
.sub{text-align:center;opacity:.7;font-size:13px;margin-bottom:20px}
.card{background:rgba(255,255,255,.1);border-radius:16px;padding:20px;margin-bottom:14px}
input{width:100%;padding:14px;font-size:17px;border-radius:12px;border:none;outline:none;margin:8px 0 14px}
button{width:100%;padding:15px;font-size:18px;font-weight:700;border:none;border-radius:12px;background:#ff4757;color:#fff;cursor:pointer}
button:active{transform:scale(.97)}button.green{background:#2ed573;color:#06281a}
button:disabled{opacity:.5}.hidden{display:none!important}
.big-time{font-size:52px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.bar-outer{height:26px;background:rgba(255,255,255,.15);border-radius:13px;overflow:hidden;margin:12px 0}
.bar-inner{height:100%;width:0%;background:linear-gradient(90deg,#ffa502,#ff4757);border-radius:13px;transition:width .15s}
.stat{display:flex;justify-content:space-between;font-size:15px;margin:6px 0}.stat b{font-size:18px}
#tapBtn{background:#2ed573;color:#06281a;margin-top:14px;padding:36px 15px;font-size:22px;user-select:none;touch-action:manipulation}
#tapBtn:active{transform:scale(.95);background:#7bed9f}
.tip{font-size:12px;opacity:.65;text-align:center;margin-top:12px;line-height:1.7}
#err{color:#ff6b81;text-align:center;min-height:20px;font-size:14px}
.team{display:flex;gap:8px;justify-content:center;margin:12px 0}
.mate{text-align:center;font-size:11px;width:56px}
.ava{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.2);overflow:hidden;margin:0 auto 4px;border:2px solid transparent}
.ava.me{border-color:#2ed573}.ava img{width:100%;height:100%;object-fit:cover}
.avpick{display:flex;gap:8px;justify-content:center;margin:8px 0;font-size:28px}
.avpick span{cursor:pointer;opacity:.5;border:2px solid transparent;border-radius:50%;padding:2px}
.avpick span.sel{opacity:1;border-color:#2ed573}
#upLbl{font-size:12px;opacity:.7;text-align:center;display:block;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>🏎️ 5人组队赛车</h1>
<div class="sub">扫码加入 · 随机5人一队 · 全队一起点击加速跑 IWPB 赛道</div>

<div id="serverView" class="card hidden">
<label>后端服务器地址：</label>
<input id="serverInput" placeholder="例如：https://xxx.onrender.com">
<div id="err"></div>
<button id="serverBtn" class="green">连接服务器</button>
<div class="tip">异地联机必须连公网后端<br>本地测试可填 http://localhost:3000</div>
</div>

<div id="joinView" class="card hidden">
<label>昵称：</label>
<input id="nickname" maxlength="10" placeholder="例如：秋名山车神">
<label>选择头像（下面点一个，或上传微信头像截图）：</label>
<div class="avpick" id="avpick"></div>
<input type="file" id="upAvatar" accept="image/*" style="padding:6px">
<span id="upLbl">不上传则使用所选表情头像。微信头像需先保存到相册再上传（微信内无法直接读取微信头像，这是微信限制）。</span>
<div id="err2" style="color:#ff6b81;text-align:center;min-height:20px;font-size:14px"></div>
<button id="joinBtn">加入并随机组队</button>
</div>

<div id="teamView" class="card hidden">
<div class="stat"><span id="teamName">—</span><b id="teamCount">0/5</b></div>
<div class="team" id="teamMates"></div>
<div class="tip" id="teamTip">等人齐5人即可开跑…</div>
<button id="startBtn" class="green hidden">🏁 全队开跑（任意一人点即可）</button>
</div>

<div id="playView" class="card hidden">
<div class="big-time" id="timer">0.0s</div>
<div class="stat"><span id="pTeamName">进度</span><b id="myDist">0 m</b></div>
<div class="bar-outer"><div id="speedBar" class="bar-inner"></div></div>
<button id="tapBtn" class="hidden">👆 全队一起点我加速</button>
<div class="tip">和队友同时快速点击，5人合力速度最快<br>跑完 IWPB 全程自动结算</div>
</div>

<div id="resultView" class="card hidden">
<div class="big-time" id="resultTime">--</div>
<div class="sub" id="resultSub"></div>
<button class="green" id="backBtn">↩ 返回队伍</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
let SERVER_URL=(qs.get('server')||'').trim()||(localStorage.getItem('race_server')||'').trim();
if(!SERVER_URL&&!location.hostname.endsWith('github.io'))SERVER_URL=location.origin;
let socket=null,myId=null,myTeam=null,running=false,startT=0,timerInt=null,clickCount=0,TRACK=400,lockUntil=0,swapTimer=null;
const EMO=['🐯','🐼','🦊','🐸','🐵','🐷','🐨','🦁'];
let myAvatar=EMO[0];
$('avpick').innerHTML=EMO.map((e,i)=>`<span data-i="${i}" class="${i===0?'sel':''}">${e}</span>`).join('');
document.querySelectorAll('#avpick span').forEach(s=>s.onclick=()=>{document.querySelectorAll('#avpick span').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');myAvatar=EMO[+s.dataset.i];});
let upData='';
$('upAvatar').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{upData=r.result;myAvatar='';document.querySelectorAll('#avpick span').forEach(x=>x.classList.remove('sel'));};r.readAsDataURL(f);};
const fmt=ms=>ms==null?'—':(ms/1000).toFixed(1)+'s';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

if(!SERVER_URL){$('serverView').classList.remove('hidden');}
else{$('joinView').classList.remove('hidden');connect();}
$('serverBtn').onclick=()=>{const v=$('serverInput').value.trim().replace(/\/$/,'');if(!v){$('err').textContent='请填写后端地址';return;}localStorage.setItem('race_server',v);location.search='?server='+encodeURIComponent(v);};
function avaHtml(m,isMe){const inner=m.avatar&&m.avatar.startsWith('data:')?`<img src="${m.avatar}">`:esc(m.avatar||'🏎️');return `<div class="mate"><div class="ava ${isMe?'me':''}">${inner}</div>${esc(m.nickname)}</div>`;}
function connect(){
socket=io(SERVER_URL,{transports:['websocket','polling']});
$('joinBtn').onclick=()=>{const n=$('nickname').value.trim()||('车手'+Math.floor(Math.random()*900+100));socket.emit('join',{nickname:n,avatar:upData||myAvatar});};
socket.on('joined',({id,team,track})=>{myId=id;myTeam=team;TRACK=track;$('joinView').classList.add('hidden');$('teamView').classList.remove('hidden');renderTeam(team);});
socket.on('join_error',({msg})=>{$('err2').textContent=msg;});
socket.on('board',({teams})=>{const t=teams.find(x=>myTeam&&x.id===myTeam.id);if(t){myTeam=t;if(!running&&t.status!=='running')renderTeam(t);}});
setInterval(()=>{if(running&&clickCount>0)socket.emit('tap',{count:clickCount});clickCount=0;},200);
$('tapBtn').addEventListener('pointerdown',()=>{clickCount+=3;if(navigator.vibrate)navigator.vibrate(12);});
$('startBtn').onclick=()=>{if(Date.now()<lockUntil)return;socket.emit('team_start');};
$('backBtn').onclick=()=>{$('resultView').classList.add('hidden');$('teamView').classList.remove('hidden');};
function renderTeam(t){
$('teamName').textContent='🚗 '+t.name;$('teamCount').textContent=t.count+'/5人';
$('teamMates').innerHTML=t.members.map(m=>avaHtml(m,m.id===myId)).join('');
if(t.count>=5){$('teamTip').textContent='人齐了！任意一人点开跑，全队一起点加速';$('startBtn').classList.remove('hidden');}
else{$('teamTip').textContent=`还差 ${5-t.count} 人，等待随机队友加入…`;$('startBtn').classList.add('hidden');}
}
socket.on('team_started',({team,startedAt})=>{myTeam=team;running=true;startT=startedAt;
$('teamView').classList.add('hidden');$('resultView').classList.add('hidden');$('playView').classList.remove('hidden');
$('pTeamName').textContent='🚗 '+team.name;$('startBtn').classList.add('hidden');$('tapBtn').classList.remove('hidden');
clearInterval(timerInt);timerInt=setInterval(()=>{$('timer').textContent=((Date.now()-startT)/1000).toFixed(1)+'s';},100);});
socket.on('team_progress',({distance,progress,elapsedMs})=>{$('myDist').textContent=distance+' m / '+TRACK+' m';$('speedBar').style.width=progress+'%';$('timer').textContent=(elapsedMs/1000).toFixed(1)+'s';});
socket.on('team_finished',({team})=>{myTeam=team;running=false;clearInterval(timerInt);clickCount=0;lockUntil=Date.now()+2000;clearTimeout(swapTimer);
$('timer').textContent=fmt(team.elapsedMs);$('speedBar').style.width='100%';
$('resultTime').textContent=fmt(team.elapsedMs);
$('resultSub').textContent=team.name+' · '+team.members.map(m=>m.nickname).join('、')+' · '+(team.bestMs?'最快'+fmt(team.bestMs):'');
swapTimer=setTimeout(()=>{$('tapBtn').classList.add('hidden');$('playView').classList.add('hidden');$('resultView').classList.remove('hidden');$('teamView').classList.remove('hidden');renderTeam(team);},1500);
if(navigator.vibrate)navigator.vibrate([100,50,100]);});
socket.on('event_reset',()=>{running=false;clearInterval(timerInt);clearTimeout(swapTimer);lockUntil=0;$('playView').classList.add('hidden');$('resultView').classList.add('hidden');$('teamView').classList.remove('hidden');$('timer').textContent='0.0s';$('speedBar').style.width='0%';});
}
</script>
</body>
</html>
