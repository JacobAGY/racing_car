<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IWPB 地图 · 5人一车</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0e1a;color:#fff;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{text-align:center;font-size:22px;margin:8px 0 2px}
.sub{text-align:center;opacity:.7;font-size:12px;margin-bottom:10px}
.card{background:rgba(255,255,255,.08);border-radius:14px;padding:16px;margin-bottom:12px}
input{width:100%;padding:12px;font-size:16px;border-radius:10px;border:none;outline:none;margin:6px 0}
button{width:100%;padding:14px;font-size:17px;font-weight:700;border:none;border-radius:10px;background:#ff4757;color:#fff;cursor:pointer;margin-top:8px}
button.green{background:#2ed573;color:#06281a}button:disabled{opacity:.45}
.hidden{display:none!important}
canvas{width:100%;height:300px;background:#10142a;border-radius:12px;display:block}
#tapBtn{padding:36px 14px;font-size:22px;user-select:none;touch-action:manipulation}
#tapBtn:active{transform:scale(.95)}
.team{display:flex;gap:8px;justify-content:center;margin:10px 0}
.mate{text-align:center;font-size:11px;width:58px}
.ava{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.18);margin:0 auto 4px;border:2px solid #666;overflow:hidden}
.ava.ready{border-color:#2ed573}.ava img{width:100%;height:100%;object-fit:cover}
.stat{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}
.tip{font-size:12px;opacity:.65;text-align:center;line-height:1.7;margin-top:8px}
#countBig{font-size:72px;font-weight:900;text-align:center}
.avpick{display:flex;gap:8px;justify-content:center;margin:8px 0;font-size:26px}
.avpick span{opacity:.45;cursor:pointer}.avpick span.sel{opacity:1;outline:2px solid #2ed573;border-radius:50%}
</style>
</head>
<body>
<div class="wrap">
<h1>🏎️ IWPB 地图 · 5人一车</h1>
<div class="sub">全员准备 → 小车上图 → 一起点击 → 跑到 B 点终点</div>

<div id="joinView" class="card">
<input id="nick" maxlength="10" placeholder="昵称">
<div class="avpick" id="avpick"></div>
<button id="joinBtn" class="green">加入并随机组队</button>
</div>

<div id="roomView" class="card hidden">
<div class="stat"><span id="teamName">—</span><b id="readyLbl">0/5 已准备</b></div>
<canvas id="cv"></canvas>
<div class="team" id="mates"></div>
<div id="countBig" class="hidden">3</div>
<button id="readyBtn" class="green">✅ 我准备好了</button>
<button id="tapBtn" class="hidden">👆 全队一起点我，小车前进</button>
<div class="tip">5人全点准备 → 小车出现在 I 点起点 → 倒计时3秒 → 一起点击冲向 B 点终点</div>
<div class="stat"><span>进度</span><b id="prog">起点 I</b></div>
<div class="stat"><span>用时</span><b id="time">0.0s</b></div>
</div>

<div id="doneView" class="card hidden">
<div style="font-size:52px;text-align:center">🏁</div>
<div class="sub" id="doneTxt"></div>
<button class="green" id="backBtn">↩ 返回队伍</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const socket=io({transports:['websocket','polling']});
const EMO=['🐯','🐼','🦊','🐸','🐵','🐷','🐨','🦁'];let myAv=EMO[0],myId=null,myTeam=null,TRACK=400;
let running=false,startT=0,timerInt=null,clickCount=0,carP=0,carShown=false,finished=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ms=>(ms/1000).toFixed(1)+'s';
$('avpick').innerHTML=EMO.map((e,i)=>`<span data-i="${i}" class="${i===0?'sel':''}">${e}</span>`).join('');
document.querySelectorAll('#avpick span').forEach(s=>s.onclick=()=>{document.querySelectorAll('#avpick span').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');myAv=EMO[+s.dataset.i];});

// ===== IWPB 地图：I→W→P→B 四段路，小车沿路径走 =====
const cv=$('cv'),ctx=cv.getContext('2d');
function pathPoint(p,W,H){ // p 0~1 映射到 I(左上)->W(右上)->P(右下)->B(左下) 回形
  const pts=[[0.12,0.22],[0.88,0.22],[0.88,0.5],[0.12,0.5],[0.12,0.78],[0.88,0.78]];
  const seg=Math.min(4,Math.floor(p*5)),t=p*5-seg;
  const a=pts[seg],b=pts[Math.min(5,seg+1)];
  return [W*(a[0]+(b[0]-a[0])*t),H*(a[1]+(b[1]-a[1])*t)];
}
function draw(){
  const dpr=devicePixelRatio||1;
  const cw=cv.clientWidth;
  if(cw>0){cv.width=cw*dpr;cv.height=300*dpr;}
  if(!cv.width){requestAnimationFrame(draw);return;}
  const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  // 路面
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=10*dpr;ctx.lineJoin='round';ctx.beginPath();
  const corner=[[0.12,0.22],[0.88,0.22],[0.88,0.5],[0.12,0.5],[0.12,0.78],[0.88,0.78]];
  corner.forEach(([x,y],i)=>{i?ctx.lineTo(W*x,H*y):ctx.moveTo(W*x,H*y);});ctx.stroke();
  // I/W/P/B 地标
  const marks=[['I',0.12,0.22,'起点'],['W',0.88,0.32,'连续弯'],['P',0.5,0.5,'发卡弯'],['B',0.88,0.78,'终点']];
  marks.forEach(([ch,x,y,tag],i)=>{
    const reached=carP*4>i+0.99;
    ctx.font=`900 ${34*dpr}px sans-serif`;
    ctx.fillStyle=ch==='B'?'#f9ca24':reached?'#2ed573':'rgba(255,255,255,.35)';
    ctx.fillText(ch,W*x,H*y-24*dpr);
    ctx.font=`${10*dpr}px sans-serif`;ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText(tag,W*x,H*y+18*dpr);
  });
  // 终点旗
  ctx.font=`${20*dpr}px serif`;ctx.fillText('🏁',W*0.88,H*0.78-24*dpr);
  // 小车：全员准备后才上图
  if(carShown){
    const [cx,cy]=pathPoint(Math.min(1,carP),W,H);
    ctx.font=`${26*dpr}px serif`;ctx.textAlign='left';ctx.fillText('🚗',cx-12*dpr,cy-8*dpr);
    ctx.font=`${13*dpr}px serif`;
    (myTeam?myTeam.members:[]).slice(0,5).forEach((m,k)=>{
      const a=(m.avatar&&!String(m.avatar).startsWith('data:'))?m.avatar:'●';
      ctx.fillStyle=m.color||'#fff';ctx.fillText(a,cx-10*dpr+k*12*dpr,cy-24*dpr);
    });
    if(finished){ctx.font=`${22*dpr}px serif`;ctx.fillStyle='#f9ca24';ctx.textAlign='center';ctx.fillText('🏆 到达终点 B！',W/2,H-20*dpr);}
  } else {
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font=`${14*dpr}px sans-serif`;ctx.textAlign='center';
    ctx.fillText('等待全员准备，小车即将发车…',W/2,H/2);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

$('joinBtn').onclick=()=>{socket.emit('join',{nickname:$('nick').value.trim()||('车手'+Math.floor(Math.random()*900+100)),avatar:myAv});};
socket.on('joined',({id,team,track})=>{myId=id;myTeam=team;TRACK=track;$('joinView').classList.add('hidden');$('roomView').classList.remove('hidden');render();});
socket.on('board',({teams})=>{const t=teams.find(x=>myTeam&&x.id===myTeam.id);if(t&&!running){myTeam=t;render();}});
socket.on('team_ready_update',({team,readyCount,teamSize})=>{myTeam=team;
  if(readyCount>=Math.min(teamSize,team.members.length)&&team.members.length>=2){carShown=true;} // 全员准备→小车上图
  render();});
socket.on('team_countdown',({n})=>{carShown=true;$('countBig').classList.remove('hidden');$('countBig').textContent=n;$('readyBtn').classList.add('hidden');});
socket.on('team_started',({team,startedAt})=>{myTeam=team;running=true;finished=false;startT=startedAt;carShown=true;
  $('countBig').classList.add('hidden');$('readyBtn').classList.add('hidden');$('tapBtn').classList.remove('hidden');
  clearInterval(timerInt);timerInt=setInterval(()=>{$('time').textContent=((Date.now()-startT)/1000).toFixed(1)+'s';},100);});
socket.on('team_progress',({distance,progress,elapsedMs})=>{carP=distance/TRACK;$('prog').textContent=Math.round(progress)+'% · '+segName(progress);$('time').textContent=(elapsedMs/1000).toFixed(1)+'s';});
socket.on('team_finished',({team})=>{myTeam=team;running=false;finished=true;carP=1;clearInterval(timerInt);
  $('time').textContent=fmt(team.elapsedMs);$('tapBtn').classList.add('hidden');
  $('doneView').classList.remove('hidden');
  $('doneTxt').textContent=`${team.name} 到达终点 B！用时 ${fmt(team.elapsedMs)} · ${team.members.map(m=>m.nickname).join('、')}`;});
socket.on('event_reset',()=>{running=false;finished=false;carShown=false;carP=0;clearInterval(timerInt);$('time').textContent='0.0s';$('prog').textContent='起点 I';$('doneView').classList.add('hidden');$('tapBtn').classList.add('hidden');$('readyBtn').classList.remove('hidden');$('countBig').classList.add('hidden');});
function segName(p){return p<25?'路段 I':p<50?'路段 W':p<75?'路段 P':'路段 B（冲刺）';}
function render(){
  $('teamName').textContent='🚗 '+(myTeam?myTeam.name:'—');
  const r=myTeam?myTeam.members.filter(m=>m.ready).length:0;
  $('readyLbl').textContent=r+'/'+(myTeam?myTeam.members.length:0)+' 已准备';
  $('mates').innerHTML=(myTeam?myTeam.members:[]).map(m=>{const inner=String(m.avatar||'🏎️').startsWith('data:')?`<img src="${m.avatar}">`:esc(m.avatar||'🏎️');return `<div class="mate"><div class="ava ${m.ready?'ready':''}">${inner}</div>${esc(m.nickname)}${m.id===myId?'（我）':''}</div>`;}).join('');
  if(myTeam&&myTeam.members.find(m=>m.id===myId&&m.ready)){$('readyBtn').disabled=true;$('readyBtn').textContent='已准备，等待队友…';}
}
$('readyBtn').onclick=()=>{socket.emit('team_ready');$('readyBtn').disabled=true;$('readyBtn').textContent='已准备，等待队友…';};
setInterval(()=>{if(running&&clickCount>0)socket.emit('tap',{count:clickCount});clickCount=0;},200);
$('tapBtn').addEventListener('pointerdown',()=>{clickCount+=3;if(navigator.vibrate)navigator.vibrate(12);});
$('backBtn').onclick=()=>{$('doneView').classList.add('hidden');};
</script>
</body>
</html>
